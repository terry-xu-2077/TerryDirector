name: TerryDirector loop report regression

on:
  push:
    branches:
      - main
      - fix/loop-vae-ram-recovery
      - feature/timeline-clip-reorder
    paths:
      - director_loop.py
      - director_loop_media.py
      - director_node.py
      - server_routes.py
      - tests/test_loop_media.py
      - web/td_loop_output_check.js
      - director_loop_memory.py
      - director_loop_video.py
      - director_loop_x2_windows.py
      - director_loop_x2_decode.py
      - tests/test_loop_x2_windows.py
      - tests/test_loop_x2_adapter.py
      - director_loop_report.py
      - director_loop_logmetrics.py
      - tests/test_loop_report.py
      - src/core.js
      - src/app.js
      - web/terry_director.js
      - web/td_timeline_projection.js
      - tests/test_suspended_timeline.mjs
      - .github/workflows/loop-report-smoke.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: python -m py_compile director_loop.py director_node.py director_loop_media.py server_routes.py director_loop_report.py director_loop_logmetrics.py director_loop_memory.py director_loop_x2_windows.py director_loop_x2_decode.py director_loop_video.py tests/test_loop_media.py tests/test_loop_report.py tests/test_loop_x2_windows.py tests/test_loop_x2_adapter.py
      - name: Report regression tests
        run: python -m unittest discover -s tests -p test_loop_report.py -v
      - name: X2 temporal window planner regression
        run: python -m unittest discover -s tests -p test_loop_x2_windows.py -v
      - name: X2 adapter regression (runs when PyTorch is available)
        run: python -m unittest discover -s tests -p test_loop_x2_adapter.py -v
      - name: MOV/MP4 frame-exact clip and merge tests (needs Torch + FFmpeg)
        run: python -m unittest discover -s tests -p test_loop_media.py -v
      - name: Suspended timeline JS syntax and regression
        run: |
          node --check src/core.js
          node --check src/app.js
          node --input-type=module --check < web/td_timeline_projection.js
          node --input-type=module --check < web/terry_director.js
          node --test tests/test_suspended_timeline.mjs
